[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creativity-lab"
version = "0.2.0"
description = "Diversity-preserving idea search with evidence-aware evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
creativity-lab = "creativity_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["creativity_lab*"]

[tool.setuptools.package-data]
creativity_lab = ["static/*", "data/*.json"]
